services:
  traccar_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traccar_server
    image: traccar_personalizado:latest
    restart: unless-stopped
    ports:
      - "8082:8082"
      - "6556:6556"
      - "6556:6556/udp"
      - "8400:8400"
      - "5263:5263"
      - "21083:21083"
      - "21720:21720"
    env_file:
      - path: .env
        required: false
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.keyStore=/opt/traccar/jt808-keystore.p12
        -Djavax.net.ssl.keyStorePassword=traccar123
        -Djavax.net.ssl.keyStoreType=PKCS12
    volumes:
      - traccar_data:/opt/traccar/data
    networks:
      - traccar-network
    depends_on:
      traccar-postgres:
        condition: service_healthy

  traccar-postgres:
    image: postgres:16
    container_name: traccar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: traccar123
    volumes:
      - traccar_postgres_data:/var/lib/postgresql/data
    networks:
      - traccar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traccar -d traccar"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  traccar_data:
    external: true
  traccar_postgres_data:

networks:
  traccar-network:
    external: true
    name: traccar-network
